    library: true
    show: false
  typescript-resource-redis:
    source: "https://github.com/p6m-archetypes/typescript-resource-redis-library.git#dev"
    library: true
    show: false
  typescript-resource-kafka:
    source: "https://github.com/p6m-archetypes/typescript-resource-kafka-library.git#dev"
    library: true
    show: false
  typescript-resource-pulsar:
    source: "https://github.com/p6m-archetypes/typescript-resource-pulsar-library.git#dev"
    library: true
