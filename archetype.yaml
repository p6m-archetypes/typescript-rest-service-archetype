description: "TypeScript REST service using Fastify v5, pnpm, and Vitest"
authors:
  - "p6m"
requires:
  archetect: ">=3.0.0"

templating:
  trim_blocks: true
  lstrip_blocks: true

catalog:
  author:
    source: "https://github.com/archetect-common/author-prompts-library.git"
    library: true
    show: false
  org:
    source: "https://github.com/archetect-common/org-prompts-library.git"
    library: true
    show: false
  project:
    source: "https://github.com/archetect-common/project-prompts-library.git"
    library: true
    show: false
  editor-config:
    source: "https://github.com/archetect-common/editor-config-library.git"
    library: true
    show: false
  gitignore:
    source: "https://github.com/archetect-common/gitignore-library.git"
    library: true
    show: false
  scm:
    source: "https://github.com/archetect-common/scm-library.git"
    library: true
    show: false
  ports:
    source: "https://github.com/archetect-common/ports-library.git"
    library: true
    show: false
  archiver:
    source: "https://github.com/archetect-common/archive-library.git"
    library: true
    show: false
  platform-application-manifests:
    source: "https://github.com/p6m-archetypes/platform-application-manifests-library.git#dev"
    library: true
    show: false
  typescript-ci:
