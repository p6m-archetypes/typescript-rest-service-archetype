# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
proofs = ["tests"]

# CI runs the same suite; capability gating (docker/pnpm) handles what a runner lacks.
[profiles.ci]
format = "json"

# Infrastructure dependencies are external plugins (pinned to released v1 tags).
[plugins]
postgres = "prova-rs/prova-postgres@v1"
mysql    = "prova-rs/prova-mysql@v1"
