# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
paths = ["tests"]

# CI runs the same suite; capability gating (docker/pnpm) handles what a runner lacks.
[profiles.ci]
paths = ["tests"]
format = "json"

# Infrastructure dependencies are external plugins (pin released tags once the plugins cut releases).
[plugins]
postgres = "prova-rs/prova-postgres@main"
mysql    = "prova-rs/prova-mysql@main"
