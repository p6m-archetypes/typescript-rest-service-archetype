[requires]
prova = ">= 0.16"

# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
proofs = ["proofs"]

# CI runs the same suite; docker is the only capability a runner needs (S8b).
[profiles.ci]
format = "json"

[profiles.e2e]
proofs = ["e2e"]
jobs = 1

# Infrastructure packages pinned to released tags; `p6m` is the org standards suite (released v1;
# the ratchet: spec bumps move the v1 tag and the fleet answers).
[dependencies]
postgres = "prova-rs/prova-postgres@v1"
mysql    = "prova-rs/prova-mysql@v1"
# NOTE (YP6M-3372): pinned to `dev`, the org's integration branch, while the studio staging is
# brought up against the whole archetype fleet — deliberate and temporary, so standards changes
# land here without waiting on a release. The suite's `p6m-pin` reminder is DUE for as long as
# this pin rides a branch (silent again on a released tag); heed it (`prova --heed=p6m-pin`, or a
# profile's `heed = ["p6m-pin"]`) when the window closes.
p6m      = { git = "https://github.com/p6m-archetypes/prova-p6m-standards", tag = "v1" }
deploy   = "p6m-archetypes/prova-p6m-deploy-loop@dev"
