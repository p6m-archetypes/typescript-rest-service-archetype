# Prova acceptance tests: `prova` from the repo root runs the whole suite.
[run]
proofs = ["tests"]

# CI runs the same suite; docker is the only capability a runner needs (S8b).
[profiles.ci]
format = "json"

# Infrastructure plugins pinned to released tags; `p6m` is the org standards suite (path-local
# while it incubates in this workspace — pin its git tag once published).
[plugins]
postgres = "prova-rs/prova-postgres@v1"
mysql    = "prova-rs/prova-mysql@v1"
p6m      = { path = "../prova-p6m-standards" }
