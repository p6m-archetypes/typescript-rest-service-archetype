name: Acceptance

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The build and live tiers install the generated project and run its Vitest suite via pnpm,
      # then boot it with `pnpm exec tsx`; provide the Node + pnpm toolchain so those tiers run
      # (prova's capability gating skips them cleanly on a runner that lacks pnpm).
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: prova-rs/run-action@v1
        with:
          profile: ci
          # -U: floating @v1 plugin pins are tag-pins, which the git cache treats as immutable —
          # force-update so a moved v1 (a spec release) is picked up on warm caches.
          args: "-U"
